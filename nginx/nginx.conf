server {
    listen 80;
    access_log off;
    client_max_body_size 16m;
    resolver 127.0.0.11 valid=10s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 330s;

    location ~ ^/(telegram|arrodes|monocle|codex|lucheba|collector|notifications|context)$ {
        return 308 /$1/;
    }

    location ~ ^/(telegram|arrodes|monocle|codex|lucheba|collector|notifications|context)/(.*)$ {
        set $service_name $1;
        set $service_path $2;
        set $admin_api backend:8000;
        proxy_pass http://$admin_api/api/integrations/services/$service_name/$service_path$is_args$args;
    }

    location = /backend { return 308 /backend/; }
    location /backend/ {
        set $board_api backend:8000;
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass http://$board_api;
    }

    location /api/ {
        set $board_api backend:8000;
        proxy_pass http://$board_api;
    }

    location / {
        set $board_ui frontend:80;
        proxy_pass http://$board_ui;
    }
}
